name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js v${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production audit gate
        run: npm run audit:prod

      - name: Run tests
        run: npm test

      - name: Smoke build (HTML)
        run: npm run build:sample -- --format html

      - name: Smoke build (PDF)
        run: npm run build:sample -- --format pdf

      - name: Smoke build (PPTX)
        run: npm run build:sample -- --format pptx
