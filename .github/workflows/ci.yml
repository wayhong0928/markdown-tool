name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Mermaid rendering works
        run: |
          cat > /tmp/test.mmd << 'EOF'
          flowchart LR
            A --> B
          EOF
          npx -y mmdc -i /tmp/test.mmd -o /tmp/test.png --backgroundColor white
          test -f /tmp/test.png

      - name: Run test suite
        run: npm test

  smoke-build:
    name: Smoke build and audit (Node 18)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Mermaid rendering works
        run: |
          cat > /tmp/test.mmd << 'EOF'
          flowchart LR
            A --> B
          EOF
          npx -y mmdc -i /tmp/test.mmd -o /tmp/test.png --backgroundColor white
          test -f /tmp/test.png

      - name: Security audit (production deps)
        run: npm run audit:prod

      - name: Clean output
        run: npm run clean

      - name: Smoke build (all formats)
        run: npm run build:sample

      - name: Verify smoke outputs exist
        run: |
          test -f output/content.example.html
          test -f output/content.example.pdf
          test -f output/content.example.pptx

      - name: Upload output artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output
          path: output/
          retention-days: 7
